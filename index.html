
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GL BAJAJ LIBRARY</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #d1d5db;
            padding: 15px;
            font-family: Arial, sans-serif;
        }

        #main {
            width: 100%;
            border: 1px solid #666;
            background-color: #f3efe0; 
        }

        #header {
            display: flex;
            align-items: center;
            background-color: #a85a1a; 
            border-bottom: 1px solid #666;
            height: 55px;
        }

        #logo {
            width: 80px;
            height: 100%;
            border-right: 1px solid #666;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #logo img {
            max-height: 100%;
            width: auto;
        }

        #title {
            flex: 1;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            color: black;
        }

        #navbar {
            display: flex;
            background-color: #e5d8bf;
            border-bottom: 2px solid #666;
        }

        #navbar a {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            color: black;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-right: 2px solid #a0a0a0;
        }

        #navbar a:last-child {
            border-right: none;
        }

        #box {
            display: flex;
            height: 420px;
        }

        #left {
            width: 15%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 100px;
            border-right: 2px solid #666;
            margin-top: 20px;
        }

        #left a {
            color: black;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }

        /* Changed: right section and iframe */
        #right {
            flex: 1;
            padding: 10px;
        }

        #right iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

    </style>
</head>
<body>

<div id="main">

    <div id="header">
        <div id="logo">
            <img src="logo.png" alt="">
        </div>
        <div id="title">
            GL Bajaj Institute Of Technology
        </div>
    </div>

    <div id="navbar">
        <a href="home.html" target="content">Home</a>
        <a href="login.html" target="content">Login</a>
        <a href="registration.html" target="content">Registration</a>
        <a href="catalogue.html" target="content">Catalouge</a>
        <a href="cart.html" target="content">Cart</a>
    </div>

    <div id="box">

        <div id="left">
            <a href="cse.html" target="content">CSE</a>
            <a href="ece.html" target="content">ECE</a>
            <a href="mee.html" target="content">MECHANICAL</a>
            <a href="civil.html" target="content">CIVIL</a>
        </div>

        <div id="right">
            <iframe src="home.html" name="content"></iframe>
        </div>

    </div>

</div>

</body>
</html>
